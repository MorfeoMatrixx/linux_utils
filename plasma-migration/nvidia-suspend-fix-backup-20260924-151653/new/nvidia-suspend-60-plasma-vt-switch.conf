# Make 50-cosmic-no-vt-switch.conf's VT-switch bypass session-aware.
# cosmic-comp (Wayland) crashes if nvidia-sleep.sh does "chvt 63" before suspend,
# but KWin/X11 (Plasma) relies on it to release/re-acquire the GPU - without it,
# PRIME outputs (HDMI-1-0) come back connected but dark after resume.
# The resume side (nvidia-sleep.sh resume -> RestoreVT) is untouched; it switches
# back to the VT recorded here, or does nothing if the Cosmic branch ran.
# Added 2026-09-24; backup + rollback.sh in /home/jlc/nvidia-suspend-fix-backup-20260924-151653
[Service]
ExecStart=
ExecStart=/bin/sh -c 'if pgrep -x cosmic-comp >/dev/null 2>&1; then /usr/bin/logger -t suspend -s "nvidia-suspend.service (COSMIC: VT switch bypassed)"; if [ -f /proc/driver/nvidia/suspend ]; then echo suspend > /proc/driver/nvidia/suspend; fi; else /usr/bin/logger -t suspend -s "nvidia-suspend.service (non-COSMIC: normal VT switch)"; exec /usr/bin/nvidia-sleep.sh suspend; fi'
